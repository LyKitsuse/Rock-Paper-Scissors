<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Paper Scissors!</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js"></script>
</head>
<body>
  <div class="play_area">
    <button id="Rock" value="Rock" onclick="game(getComputerChoice(), 'rock')">Rock</button>
    <button id="Paper" value="Paper" onclick="game(getComputerChoice(), 'paper')">Paper</button>
    <button id="Scissors" value="Scissors" onclick="game(getComputerChoice(), 'scissors')">Scissors</button>
  </div>
  <div class="results">
    <div class="score bot">
      <h2>Bot Score</h2>
      <h3 id="bot_score">0</h3>
    </div>
    <div class="score player">
      <h2>Player Score</h2>
      <h3 id="player_score">0</h3>
    </div>
  </div>
  <div class="verdict">
    <h1 id="final_result"></h1>
  </div>
  <button id="reset" onclick="reset()">Reset</button>
</body>
</html>
